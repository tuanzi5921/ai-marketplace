# 企业 AI 应用市场 — Redis 配置（数据层 192.168.1.131）
# 部署位置：/aitest/redis/conf/redis.conf
# 由 systemd drop-in 覆盖 ExecStart 后加载，原 /etc/redis/redis.conf 不再使用。
# __REDIS_PASSWORD__ 占位符由 setup-data-server.sh 在部署时替换为随机口令。

bind 0.0.0.0 -::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
supervised systemd
pidfile /run/redis/redis-server.pid

loglevel notice
logfile /aitest/redis/logs/redis-server.log

databases 16
dir /aitest/redis/data
dbfilename dump.rdb

save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
appendonly no

# 当前仅用于缓存企微 access_token，1GB 足够；淘汰策略保证不会写满内存
maxmemory 1gb
maxmemory-policy allkeys-lru

requirepass __REDIS_PASSWORD__
