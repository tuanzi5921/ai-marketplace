# 企业 AI 应用市场 — 运营后台（应用层 192.168.1.132，端口 8081）
# 部署位置：/etc/nginx/sites-available/admin.conf → 软链到 sites-enabled/
#
# 为什么用独立端口而不是 README 里写的 /admin 子路径：
# frontend-admin/vite.config.ts 没有设置 base，router 用的是无参 createWebHistory()，
# 构建产物里的资源引用是 /assets/... 绝对路径。若挂到 /admin 子路径下会全站白屏。
# 独立端口 + 根路径部署可以零代码改动解决；日后要合并到子路径，
# 需同时给 vite.config.ts 加 base:'/admin/' 并把 router 改成 createWebHistory('/admin/')。

server {
    listen 8081;
    listen [::]:8081;
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name _;

    ssl_certificate     /aitest/nginx/cert/tri-ibiotech.com.pem;
    ssl_certificate_key /aitest/nginx/cert/tri-ibiotech.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_admin:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /aitest/www/admin;
    index index.html;

    client_max_body_size 500m;

    access_log /aitest/nginx/logs/admin-access.log;
    error_log  /aitest/nginx/logs/admin-error.log warn;

    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ {
        default_type text/plain;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
