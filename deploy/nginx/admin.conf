# 企业 AI 应用市场 — 运营后台（应用层 192.168.1.132）
# 部署位置：/aitest/nginx/conf/admin.conf（/etc/nginx/sites-enabled 里是软链）
#
# 只在 8443 提供 HTTPS，且 ufw 已把 8443 限制为内网网段可访问，公网不可达。
# 原先的明文 8081 已让给员工工作台（那是企业微信侧的正式入口），
# 后台不再监听 8081，避免账号口令在公网走明文。
#
# 内网访问方式：
#   https://192.168.1.132:8443/     ← 立即可用，但证书是 *.tri-ibiotech.com，
#                                      用 IP 访问会有名称不匹配告警，需手动继续
#   https://ai-marketplace.tri-ibiotech.com:8443/
#                                   ← 证书完全匹配、无告警，但需要满足下面任一条件：
#                                      (a) 内网 DNS 把该域名解析到 192.168.1.132（推荐，
#                                          即 split-horizon DNS，顺带省掉 NAT 回环），或
#                                      (b) 公网入口新增 8443 → 192.168.1.132:8443 的映射
#
# 为什么不用 README 里写的 /admin 子路径：
# frontend-admin/vite.config.ts 没有设置 base，router 用的是无参 createWebHistory()，
# 构建产物里的资源引用是 /assets/... 绝对路径，挂到子路径下会全站白屏。
# 若要合并到子路径，需同时给 vite.config.ts 加 base:'/admin/'
# 并把 router 改成 createWebHistory('/admin/')。

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name ai-marketplace.tri-ibiotech.com _;

    ssl_certificate     /aitest/nginx/cert/tri-ibiotech.com.pem;
    ssl_certificate_key /aitest/nginx/cert/tri-ibiotech.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_admin:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /aitest/www/admin;
    index index.html;

    client_max_body_size 500m;

    access_log /aitest/nginx/logs/admin-access.log;
    error_log  /aitest/nginx/logs/admin-error.log warn;

    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ {
        default_type text/plain;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";

        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
