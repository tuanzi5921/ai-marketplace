# 企业 AI 应用市场 — 员工工作台（应用层 192.168.1.132，端口 80）
# 部署位置：/etc/nginx/sites-available/workbench.conf → 软链到 sites-enabled/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2;
    server_name _;

    # 通配符证书 *.tri-ibiotech.com（SAN 同时覆盖裸域），含完整证书链
    ssl_certificate     /aitest/nginx/cert/tri-ibiotech.com.pem;
    ssl_certificate_key /aitest/nginx/cert/tri-ibiotech.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_workbench:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # 证书到期日 2027-01-07，续期后需 reload nginx
    # 待正式域名与 WAF 回源方式确定后，再补 HTTP→HTTPS 强制跳转与 HSTS；
    # 现在不跳转是因为若 WAF 以 HTTP 回源会造成重定向回环。

    root /aitest/www/workbench;
    index index.html;

    # 后端 multipart 上限 500MB，Nginx 默认 1m 会直接返回 413
    client_max_body_size 500m;

    access_log /aitest/nginx/logs/workbench-access.log;
    error_log  /aitest/nginx/logs/workbench-error.log warn;

    # 企业微信「可信域名」归属验证文件，必须能在域名根路径直接取到
    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ {
        default_type text/plain;
        try_files $uri =404;
    }

    # 后端 context-path 为 /api，此处保持前缀透传
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 大文件上传不在 Nginx 落盘缓冲，直接透传给后端
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    # 带 hash 的静态资源可长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA history 路由回退；index.html 不缓存，保证发版后立即生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
