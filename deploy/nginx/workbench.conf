# 企业 AI 应用市场 — 员工工作台（应用层 192.168.1.132）
# 部署位置：/aitest/nginx/conf/workbench.conf（/etc/nginx/sites-enabled 里是软链）
#
# 端口分工：
#   8081 HTTPS ← 企业微信侧的正式入口 https://ai-marketplace.tri-ibiotech.com:8081/
#                公网 121.46.250.190:8081 已 DNAT 到本机 8081，所以此端口必须对外可达，
#                不要对它做 ufw 网段限制，否则企微侧打不开。
#   443  HTTPS ← 内网直连用。公网 443 指向公司官网 nginx，不会到本机。
#   80   HTTP  ← 301 跳到正式入口，避免账号口令在内网走明文。
#
# 运营后台不在本文件里，见 admin.conf（仅 8443，且 ufw 限内网网段）。

# ---------------------------------------------------------------------------
# HTTP:80 —— 仅做跳转，不提供业务
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ai-marketplace.tri-ibiotech.com _;

    access_log /aitest/nginx/logs/workbench-http-access.log;

    # 保留验证文件的直接可达性，便于内网自查（公网 443 那份由官网 nginx 提供）
    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ {
        root /aitest/www/workbench;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ai-marketplace.tri-ibiotech.com:8081$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS:443 与 HTTPS:8081 —— 同一个站点，两个入口
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2;
    listen 8081 ssl http2;
    listen [::]:8081 ssl http2;
    server_name ai-marketplace.tri-ibiotech.com _;

    # 通配符证书 *.tri-ibiotech.com（SAN 同时覆盖裸域），含完整三级证书链
    # 到期日 2027-01-07，续期后需 systemctl reload nginx
    ssl_certificate     /aitest/nginx/cert/tri-ibiotech.com.pem;
    ssl_certificate_key /aitest/nginx/cert/tri-ibiotech.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_workbench:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # 刻意不加 HSTS：证书是人工续期的，一旦过期而 HSTS 仍在有效期内，
    # 浏览器会直接拒绝连接且无法点击继续，反而把内部用户彻底锁在门外。

    root /aitest/www/workbench;
    index index.html;

    # 后端 multipart 上限 500MB，Nginx 默认 1m 会直接返回 413
    client_max_body_size 500m;

    access_log /aitest/nginx/logs/workbench-access.log;
    error_log  /aitest/nginx/logs/workbench-error.log warn;

    # --- 明文 HTTP 打到 TLS 端口的兜底 -------------------------------------
    # 8081 与 443 都是 ssl 端口，收到明文 HTTP 请求时 Nginx 内部产生 497，
    # 默认直接回 400。企业微信「域名归属校验」有可能用 http:// 去抓校验文件，
    # 400 会让可信域名加不上，因此这里让校验文件在明文请求下也原样返回，
    # 其余路径统一 301 到 HTTPS，避免账号口令走明文。
    error_page 497 = @plain_http;

    location @plain_http {
        root         /aitest/www/workbench;
        default_type text/plain;
        try_files $uri @plain_to_https;
    }

    location @plain_to_https {
        return 301 https://$host:$server_port$request_uri;
    }

    # 企业微信「可信域名」归属验证文件
    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ {
        default_type text/plain;
        try_files $uri =404;
    }

    # 后端 context-path 为 /api，此处保持前缀透传
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 企微 OAuth 要求回跳地址是 HTTPS，这里必须传 https 而不是内网的 http
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";

        # 大文件上传不在 Nginx 落盘缓冲，直接透传给后端
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    # 带 hash 的静态资源可长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA history 路由回退；index.html 不缓存，保证发版后立即生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
