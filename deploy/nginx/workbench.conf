# 企业 AI 应用市场 — 员工工作台（应用层 192.168.1.132，端口 80）
# 部署位置：/etc/nginx/sites-available/workbench.conf → 软链到 sites-enabled/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /aitest/www/workbench;
    index index.html;

    # 后端 multipart 上限 500MB，Nginx 默认 1m 会直接返回 413
    client_max_body_size 500m;

    access_log /aitest/nginx/logs/workbench-access.log;
    error_log  /aitest/nginx/logs/workbench-error.log warn;

    # 后端 context-path 为 /api，此处保持前缀透传
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 大文件上传不在 Nginx 落盘缓冲，直接透传给后端
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    # 带 hash 的静态资源可长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA history 路由回退；index.html 不缓存，保证发版后立即生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
