<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>企业 AI 应用市场 · 运营后台（本地预览）</title>
<style>
  :root{
    --bg:#0f172a;
    --bg-soft:#1e293b;
    --card:#ffffff;
    --brand:#4f46e5;
    --brand-2:#7c3aed;
    --brand-grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);
    --text-main:#0f172a;
    --text-sub:#64748b;
    --text-muted:#94a3b8;
    --border:#e2e8f0;
    --danger:#ef4444;
    --success:#10b981;
    --tag-admin:#7c3aed;
    --tag-operator:#0ea5e9;
    --tag-judge:#f59e0b;
    --tag-dept:#10b981;
    --tag-user:#94a3b8;
    --shadow:0 10px 30px rgba(2,6,23,.12), 0 4px 12px rgba(2,6,23,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(99,102,241,.18), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(168,85,247,.16), transparent 60%),
      var(--bg);
    color:var(--text-main);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .hidden{display:none !important}

  /* ============ Login / Change Password Card ============ */
  .auth-wrap{
    width:100%;
    max-width:440px;
  }
  .brand-mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:56px;height:56px;
    border-radius:14px;
    background:var(--brand-grad);
    color:#fff;
    font-weight:800;
    font-size:24px;
    letter-spacing:1px;
    box-shadow:0 8px 24px rgba(99,102,241,.45);
    margin:0 auto 16px;
  }
  .auth-card{
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:36px 32px 28px;
  }
  .auth-title{
    font-size:20px;
    font-weight:700;
    text-align:center;
    color:var(--text-main);
    margin-bottom:4px;
  }
  .auth-subtitle{
    font-size:13px;
    color:var(--text-sub);
    text-align:center;
    margin-bottom:24px;
  }
  .field{margin-bottom:18px;position:relative}
  .field label{
    display:block;
    font-size:13px;
    color:var(--text-sub);
    margin-bottom:6px;
    font-weight:500;
  }
  .field .control{position:relative}
  .field input[type=text],
  .field input[type=password],
  .field input[type=email]{
    width:100%;
    height:40px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    color:var(--text-main);
    background:#fff;
    transition:border-color .15s, box-shadow .15s;
    outline:none;
  }
  .field input:focus{
    border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(79,70,229,.15);
  }
  .field.has-pw input{padding-right:36px}
  .toggle-pw{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border:0;background:transparent;cursor:pointer;
    color:var(--text-muted);font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    border-radius:4px;
  }
  .toggle-pw:hover{color:var(--brand)}
  .hint{
    font-size:12px;color:var(--text-muted);
    background:#f8fafc;border:1px dashed var(--border);
    border-radius:6px;padding:8px 10px;margin-top:-6px;margin-bottom:18px;
    line-height:1.5;
  }
  .hint code{
    background:#eef2ff;color:#4338ca;padding:1px 5px;border-radius:4px;font-size:12px;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    height:40px;padding:0 18px;
    border-radius:8px;border:1px solid transparent;
    font-size:14px;font-weight:600;cursor:pointer;
    transition:all .15s;
    background:#fff;color:var(--text-main);
    border-color:var(--border);
  }
  .btn:hover{border-color:#cbd5e1}
  .btn-primary{
    background:var(--brand);color:#fff;border-color:var(--brand);
    box-shadow:0 4px 12px rgba(79,70,229,.3);
  }
  .btn-primary:hover{background:#4338ca;border-color:#4338ca}
  .btn-block{width:100%}
  .btn-sm{height:30px;padding:0 12px;font-size:12px}
  .btn-danger{background:#fff;color:var(--danger);border-color:#fecaca}
  .btn-danger:hover{background:#fef2f2}
  .btn-success{background:#fff;color:var(--success);border-color:#bbf7d0}
  .btn-success:hover{background:#f0fdf4}
  .field-error{
    color:var(--danger);font-size:12px;margin-top:6px;min-height:14px;
  }
  .auth-footnote{
    text-align:center;font-size:12px;color:var(--text-muted);
    margin-top:18px;line-height:1.6;
  }
  .auth-alert{
    border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;
    border:1px solid;
  }
  .alert-error{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
  .alert-success{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}

  /* ============ Dashboard Layout ============ */
  .dash-shell{
    width:100%;max-width:1080px;
    background:var(--card);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .dash-topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;background:#fff;border-bottom:1px solid var(--border);
  }
  .dash-topbar .left{display:flex;align-items:center;gap:10px}
  .dash-topbar .brand-mini{
    width:32px;height:32px;border-radius:8px;background:var(--brand-grad);
    color:#fff;font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(99,102,241,.35);
  }
  .dash-topbar .title{font-size:15px;font-weight:700;color:var(--text-main)}
  .dash-topbar .whoami{font-size:12px;color:var(--text-sub);margin-left:6px}
  .dash-topbar .right{display:flex;gap:8px}
  .dash-tabs{
    display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:1px solid var(--border);
  }
  .tab-btn{
    padding:10px 14px;font-size:14px;background:transparent;border:0;cursor:pointer;
    color:var(--text-sub);border-bottom:2px solid transparent;font-weight:500;
  }
  .tab-btn.active{color:var(--brand);border-bottom-color:var(--brand)}
  .tab-btn:hover{color:var(--brand)}
  .dash-body{padding:24px;background:#f8fafc;min-height:420px}
  .dash-welcome{
    background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;
    display:flex;align-items:center;gap:16px;
  }
  .avatar{
    width:48px;height:48px;border-radius:50%;background:var(--brand-grad);
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;
  }
  .welcome-text .hi{font-size:16px;font-weight:700;color:var(--text-main)}
  .welcome-text .meta{font-size:13px;color:var(--text-sub);margin-top:4px}
  .role-tags{display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .role-tag{
    font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;
    border:1px solid transparent;letter-spacing:.3px;
  }
  .tag-USER{background:#f1f5f9;color:#64748b;border-color:#e2e8f0}
  .tag-ADMIN{background:#ede9fe;color:#6d28d9;border-color:#ddd6fe}
  .tag-OPERATOR{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}
  .tag-JUDGE{background:#fef3c7;color:#b45309;border-color:#fde68a}
  .tag-DEPT_HEAD{background:#d1fae5;color:#047857;border-color:#a7f3d0}
  .tag-DISABLED{background:#fee2e2;color:#b91c1c;border-color:#fecaca}

  /* ============ User Management Table ============ */
  .user-table{
    width:100%;background:#fff;border:1px solid var(--border);border-radius:12px;
    border-collapse:collapse;overflow:hidden;font-size:13px;
  }
  .user-table thead th{
    background:#f1f5f9;color:#475569;text-align:left;font-weight:600;
    padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;
    letter-spacing:.3px;text-transform:uppercase;
  }
  .user-table tbody td{
    padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-main);
    vertical-align:middle;
  }
  .user-table tbody tr:last-child td{border-bottom:0}
  .user-table tbody tr:hover{background:#f8fafc}
  .row-disabled td{color:var(--text-muted)}
  .switch{
    display:inline-flex;align-items:center;gap:6px;
  }
  .switch .dot{
    width:34px;height:18px;border-radius:10px;background:#cbd5e1;
    position:relative;transition:background .15s;cursor:pointer;
  }
  .switch .dot::after{
    content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;
    background:#fff;border-radius:50%;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .switch.on .dot{background:var(--success)}
  .switch.on .dot::after{left:18px}
  .switch-label{font-size:12px;color:var(--text-sub)}
  .role-select{
    height:30px;padding:0 8px;border:1px solid var(--border);border-radius:6px;
    font-size:12px;background:#fff;color:var(--text-main);outline:none;
  }
  .role-select:focus{border-color:var(--brand)}
  .op-cell{display:flex;gap:6px;align-items:center}
  .empty-row td{text-align:center;color:var(--text-muted);padding:32px}

  /* ============ Modal ============ */
  .modal-mask{
    position:fixed;inset:0;background:rgba(2,6,23,.55);
    display:flex;align-items:center;justify-content:center;z-index:50;
    backdrop-filter:blur(2px);
  }
  .modal{
    width:100%;max-width:440px;background:#fff;border-radius:14px;
    box-shadow:0 20px 50px rgba(2,6,23,.3);overflow:hidden;
  }
  .modal-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;border-bottom:1px solid var(--border);
  }
  .modal-head h3{font-size:15px;font-weight:700}
  .modal-close{
    border:0;background:transparent;font-size:20px;color:var(--text-muted);
    cursor:pointer;line-height:1;width:24px;height:24px;border-radius:4px;
  }
  .modal-close:hover{color:var(--danger)}
  .modal-body{padding:20px}
  .modal-foot{
    padding:14px 20px;border-top:1px solid var(--border);
    display:flex;justify-content:flex-end;gap:8px;background:#f8fafc;
  }
  .checkbox-group{display:flex;flex-wrap:wrap;gap:8px 14px}
  .checkbox-item{
    display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-main);
    background:#f8fafc;border:1px solid var(--border);padding:6px 10px;border-radius:8px;
    cursor:pointer;
  }
  .checkbox-item input{margin:0}
  .checkbox-item.checked{background:#eef2ff;border-color:#c7d2fe;color:#4338ca}
  .field-help{font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.5}
  .form-grid{display:grid;grid-template-columns:1fr;gap:14px}

  /* small screens */
  @media (max-width:640px){
    .auth-card{padding:28px 20px}
    .dash-body{padding:16px}
    .dash-topbar{padding:12px 16px;flex-wrap:wrap;gap:10px}
    .dash-tabs{padding:0 16px;overflow-x:auto}
    .user-table{font-size:12px}
    .user-table thead th,.user-table tbody td{padding:8px 8px}
    .op-cell{flex-wrap:wrap}
  }
</style>
</head>
<body>

<!-- ============ LOGIN VIEW ============ -->
<section id="view-login" class="auth-wrap">
  <div class="brand-mark">AI</div>
  <div class="auth-card">
    <div class="auth-title">企业 AI 应用市场 · 运营后台</div>
    <div class="auth-subtitle">仅限运营 / 超管 / 评委角色访问</div>

    <div id="loginAlert"></div>

    <div class="field">
      <label for="loginAccount">账号</label>
      <div class="control">
        <input id="loginAccount" type="text" autocomplete="off" placeholder="请输入账号（如 admin）" />
      </div>
    </div>

    <div class="field has-pw">
      <label for="loginPassword">密码</label>
      <div class="control">
        <input id="loginPassword" type="password" autocomplete="off" placeholder="请输入密码" />
        <button type="button" class="toggle-pw" data-target="loginPassword" title="显示/隐藏密码">👁</button>
      </div>
    </div>

    <div class="hint">
      默认账号 <code>admin</code> / <code>Welcome@2026</code>（首次登录无需改密）；可创建新用户后用新邮箱 + <code>Welcome@2026</code> 登录测试首次改密流程。
    </div>

    <button type="button" class="btn btn-primary btn-block" id="btnLogin">登 录</button>

    <div class="auth-footnote">
      登录即表示同意企业 AI 应用市场使用规范
    </div>
  </div>
</section>

<!-- ============ CHANGE PASSWORD VIEW ============ -->
<section id="view-change" class="auth-wrap hidden">
  <div class="brand-mark">AI</div>
  <div class="auth-card">
    <div class="auth-title">首次登录 · 修改密码</div>
    <div class="auth-subtitle">为了账号安全，请先修改初始密码</div>

    <div id="changeAlert"></div>

    <div class="field has-pw">
      <label for="oldPwd">旧密码</label>
      <div class="control">
        <input id="oldPwd" type="password" autocomplete="off" placeholder="请输入旧密码" />
        <button type="button" class="toggle-pw" data-target="oldPwd" title="显示/隐藏密码">👁</button>
      </div>
    </div>

    <div class="field has-pw">
      <label for="newPwd">新密码</label>
      <div class="control">
        <input id="newPwd" type="password" autocomplete="off" placeholder="至少 8 位" />
        <button type="button" class="toggle-pw" data-target="newPwd" title="显示/隐藏密码">👁</button>
      </div>
      <div class="field-error" id="errNew"></div>
    </div>

    <div class="field has-pw">
      <label for="confirmPwd">确认新密码</label>
      <div class="control">
        <input id="confirmPwd" type="password" autocomplete="off" placeholder="再次输入新密码" />
        <button type="button" class="toggle-pw" data-target="confirmPwd" title="显示/隐藏密码">👁</button>
      </div>
      <div class="field-error" id="errConfirm"></div>
    </div>

    <button type="button" class="btn btn-primary btn-block" id="btnChange">提交修改</button>
  </div>
</section>

<!-- ============ DASHBOARD VIEW ============ -->
<section id="view-dash" class="hidden" style="width:100%;display:flex;justify-content:center;">
  <div class="dash-shell">
    <div class="dash-topbar">
      <div class="left">
        <div class="brand-mini">AI</div>
        <div>
          <div class="title">运营后台</div>
        </div>
        <div class="whoami">当前用户：<span id="curUsername">—</span></div>
      </div>
      <div class="right">
        <button type="button" class="btn btn-primary btn-sm" id="btnNewUser">+ 新建用户</button>
        <button type="button" class="btn btn-sm" id="btnLogout">退出登录</button>
      </div>
    </div>
    <div class="dash-tabs">
      <button class="tab-btn active" data-tab="dashboard">仪表盘</button>
      <button class="tab-btn" data-tab="users">用户管理</button>
    </div>
    <div class="dash-body">
      <!-- Dashboard tab -->
      <div id="tab-dashboard">
        <div class="dash-welcome">
          <div class="avatar" id="avatarLetter">A</div>
          <div class="welcome-text">
            <div class="hi" id="welcomeHi">欢迎！</div>
            <div class="meta" id="welcomeMeta"></div>
            <div class="role-tags" id="welcomeRoles"></div>
          </div>
        </div>
      </div>
      <!-- Users tab -->
      <div id="tab-users" class="hidden">
        <table class="user-table">
          <thead>
            <tr>
              <th style="width:120px">用户名</th>
              <th style="width:130px">姓名</th>
              <th>邮箱</th>
              <th style="width:200px">角色</th>
              <th style="width:90px">启用</th>
              <th style="width:240px">操作</th>
            </tr>
          </thead>
          <tbody id="userTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- ============ NEW USER MODAL ============ -->
<div id="newUserModal" class="modal-mask hidden">
  <div class="modal">
    <div class="modal-head">
      <h3>新建用户</h3>
      <button class="modal-close" id="closeNewUser">×</button>
    </div>
    <div class="modal-body">
      <div id="modalAlert"></div>
      <div class="form-grid">
        <div class="field">
          <label for="newEmail">邮箱 *</label>
          <input id="newEmail" type="email" placeholder="user@example.com" autocomplete="off" />
          <div class="field-error" id="errEmail"></div>
        </div>
        <div class="field">
          <label for="newUsername">姓名（可选）</label>
          <input id="newUsername" type="text" placeholder="请输入姓名" autocomplete="off" />
        </div>
        <div class="field">
          <label>角色（多选）</label>
          <div class="checkbox-group" id="roleCheckbox">
            <label class="checkbox-item"><input type="checkbox" value="OPERATOR" /> 运营 OPERATOR</label>
            <label class="checkbox-item"><input type="checkbox" value="JUDGE" /> 评委 JUDGE</label>
            <label class="checkbox-item"><input type="checkbox" value="DEPT_HEAD" /> 部门负责人 DEPT_HEAD</label>
            <label class="checkbox-item"><input type="checkbox" value="ADMIN" /> 管理员 ADMIN</label>
          </div>
        </div>
        <div class="field-help">初始密码为 <code style="background:#eef2ff;color:#4338ca;padding:1px 5px;border-radius:4px;">Welcome@2026</code>，用户首次登录后需修改。</div>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-sm" id="cancelNewUser">取消</button>
      <button type="button" class="btn btn-primary btn-sm" id="confirmNewUser">确认创建</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============ Mock Data ============ */
  var STORAGE_KEY = "ai_marketplace_users_v1";

  var DEFAULT_USERS = [
    { id:1, account:'admin',       password:'Welcome@2026', username:'Administrator',  email:'admin@example.com',  roles:['USER','ADMIN'],     points:999, enabled:true,  mustChangePassword:false },
    { id:2, account:'operator1',   password:'Welcome@2026', username:'运营小王',       email:'op1@example.com',    roles:['USER','OPERATOR'],  points:50,  enabled:true,  mustChangePassword:true  },
    { id:3, account:'judge1',      password:'Welcome@2026', username:'评委老李',       email:'judge1@example.com', roles:['USER','JUDGE'],     points:120, enabled:true,  mustChangePassword:false },
    { id:4, account:'dept_head1',  password:'Welcome@2026', username:'部门负责人赵',   email:'dh1@example.com',   roles:['USER','DEPT_HEAD'], points:80,  enabled:false, mustChangePassword:false }
  ];

  function loadUsers(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_USERS));
        return clone(DEFAULT_USERS);
      }
      var arr = JSON.parse(raw);
      if(!Array.isArray(arr)) throw new Error("bad");
      return arr;
    }catch(e){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_USERS));
      return clone(DEFAULT_USERS);
    }
  }
  function saveUsers(arr){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  /* ============ Session ============ */
  var currentSession = null; // {id, account, username, roles, points, enabled, mustChangePassword}

  function findUserByAccount(account){
    var users = loadUsers();
    for(var i=0;i<users.length;i++){
      if(users[i].account === account) return users[i];
    }
    return null;
  }
  function updateUserById(id, patch){
    var users = loadUsers();
    for(var i=0;i<users.length;i++){
      if(users[i].id === id){
        for(var k in patch){
          if(Object.prototype.hasOwnProperty.call(patch,k)){
            users[i][k] = patch[k];
          }
        }
        saveUsers(users);
        return users[i];
      }
    }
    return null;
  }

  /* ============ View Switch ============ */
  function show(view){
    ["view-login","view-change","view-dash"].forEach(function(id){
      var el = document.getElementById(id);
      if(id === view){ el.classList.remove("hidden"); el.style.display = ""; }
      else { el.classList.add("hidden"); }
    });
    if(view === "view-dash"){ renderDashboard(); }
  }

  /* ============ Alerts ============ */
  function setAlert(containerId, msg, type){
    var el = document.getElementById(containerId);
    if(!el) return;
    if(!msg){ el.innerHTML = ""; return; }
    var cls = type === "success" ? "alert-success" : "alert-error";
    el.innerHTML = '<div class="auth-alert ' + cls + '">' + escapeHtml(msg) + '</div>';
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  /* ============ Toggle password visibility ============ */
  document.querySelectorAll(".toggle-pw").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-target");
      var inp = document.getElementById(id);
      if(!inp) return;
      if(inp.type === "password"){ inp.type = "text"; btn.textContent = "🙈"; }
      else { inp.type = "password"; btn.textContent = "👁"; }
    });
  });

  /* ============ Login ============ */
  var loginAccountEl = document.getElementById("loginAccount");
  var loginPasswordEl = document.getElementById("loginPassword");
  document.getElementById("btnLogin").addEventListener("click", doLogin);
  loginAccountEl.addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });
  loginPasswordEl.addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });

  function doLogin(){
    setAlert("loginAlert", "");
    var account = loginAccountEl.value.trim();
    var password = loginPasswordEl.value;
    if(!account || !password){
      setAlert("loginAlert", "请输入账号和密码", "error");
      return;
    }
    var u = findUserByAccount(account);
    if(!u || u.password !== password){
      setAlert("loginAlert", "账号或密码错误", "error");
      return;
    }
    if(!u.enabled){
      setAlert("loginAlert", "该账号已被禁用，请联系管理员", "error");
      return;
    }
    currentSession = {
      id: u.id, account: u.account, username: u.username,
      roles: clone(u.roles), points: u.points,
      enabled: u.enabled, mustChangePassword: u.mustChangePassword
    };
    if(u.mustChangePassword){
      // go to change page; pre-fill old password placeholder
      oldPwdEl.value = "";
      newPwdEl.value = "";
      confirmPwdEl.value = "";
      setAlert("changeAlert", "");
      setError("errNew","");
      setError("errConfirm","");
      show("view-change");
    }else{
      show("view-dash");
    }
  }

  /* ============ Change Password ============ */
  var oldPwdEl = document.getElementById("oldPwd");
  var newPwdEl = document.getElementById("newPwd");
  var confirmPwdEl = document.getElementById("confirmPwd");
  document.getElementById("btnChange").addEventListener("click", doChange);

  function setError(id, msg){
    var el = document.getElementById(id);
    if(el) el.textContent = msg || "";
  }
  function doChange(){
    setAlert("changeAlert", "");
    var oldp = oldPwdEl.value;
    var newp = newPwdEl.value;
    var cfm  = confirmPwdEl.value;
    var hasErr = false;
    setError("errNew","");
    setError("errConfirm","");

    if(!oldp || !newp || !cfm){
      setAlert("changeAlert", "请填写全部字段", "error");
      return;
    }
    if(oldp !== getUserPassword(currentSession.id)){
      setAlert("changeAlert", "旧密码不正确", "error");
      return;
    }
    if(newp.length < 8){
      setError("errNew","新密码至少 8 位");
      hasErr = true;
    }
    if(newp !== cfm){
      setError("errConfirm","两次输入不一致");
      hasErr = true;
    }
    if(hasErr) return;

    // OK, persist
    updateUserById(currentSession.id, { password: newp, mustChangePassword: false });
    currentSession.mustChangePassword = false;
    currentSession.password = newp;
    alert("密码修改成功，即将进入后台");
    show("view-dash");
  }
  function getUserPassword(id){
    var users = loadUsers();
    for(var i=0;i<users.length;i++){
      if(users[i].id === id) return users[i].password;
    }
    return null;
  }

  /* ============ Dashboard ============ */
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      var tab = btn.getAttribute("data-tab");
      document.getElementById("tab-dashboard").classList.toggle("hidden", tab !== "dashboard");
      document.getElementById("tab-users").classList.toggle("hidden", tab !== "users");
      if(tab === "users") renderUserTable();
    });
  });

  function renderDashboard(){
    if(!currentSession) return;
    document.getElementById("curUsername").textContent = currentSession.username + "（" + currentSession.account + "）";
    document.getElementById("welcomeHi").textContent = "欢迎，" + currentSession.username + "！";
    document.getElementById("welcomeMeta").innerHTML =
      "您的角色：<b>" + escapeHtml(currentSession.roles.join(" / ")) + "</b> &nbsp;·&nbsp; 积分：<b>" +
      escapeHtml(String(currentSession.points)) + "</b>";
    var rolesBox = document.getElementById("welcomeRoles");
    rolesBox.innerHTML = "";
    currentSession.roles.forEach(function(r){
      var span = document.createElement("span");
      span.className = "role-tag tag-" + r;
      span.textContent = r;
      rolesBox.appendChild(span);
    });
    var letter = (currentSession.username || currentSession.account || "U").charAt(0).toUpperCase();
    document.getElementById("avatarLetter").textContent = letter;
  }

  /* ============ User Table ============ */
  function renderUserTable(){
    var users = loadUsers();
    var tbody = document.getElementById("userTbody");
    tbody.innerHTML = "";
    if(users.length === 0){
      var tr = document.createElement("tr");
      tr.className = "empty-row";
      tr.innerHTML = '<td colspan="6">暂无用户</td>';
      tbody.appendChild(tr);
      return;
    }
    users.forEach(function(u){
      var tr = document.createElement("tr");
      if(!u.enabled) tr.className = "row-disabled";

      // 用户名
      var tdAcc = document.createElement("td");
      tdAcc.innerHTML = "<b>" + escapeHtml(u.account) + "</b>" + (u.mustChangePassword ? ' <span class="role-tag tag-JUDGE" style="margin-left:4px">待改密</span>' : "");
      tr.appendChild(tdAcc);

      // 姓名
      var tdName = document.createElement("td");
      tdName.textContent = u.username || "—";
      tr.appendChild(tdName);

      // 邮箱
      var tdEmail = document.createElement("td");
      tdEmail.textContent = u.email || "—";
      tr.appendChild(tdEmail);

      // 角色 tags
      var tdRoles = document.createElement("td");
      var tagsBox = document.createElement("div");
      tagsBox.style.display = "inline-flex";
      tagsBox.style.gap = "4px";
      tagsBox.style.flexWrap = "wrap";
      (u.roles || []).forEach(function(r){
        var span = document.createElement("span");
        span.className = "role-tag tag-" + r;
        span.textContent = r;
        tagsBox.appendChild(span);
      });
      tdRoles.appendChild(tagsBox);
      tr.appendChild(tdRoles);

      // 启用状态 switch
      var tdEnabled = document.createElement("td");
      var sw = document.createElement("span");
      sw.className = "switch " + (u.enabled ? "on" : "");
      sw.innerHTML = '<span class="dot"></span><span class="switch-label">' + (u.enabled ? "启用" : "禁用") + '</span>';
      sw.addEventListener("click", (function(uid){ return function(){ toggleEnabled(uid); }; })(u.id));
      tdEnabled.appendChild(sw);
      tr.appendChild(tdEnabled);

      // 操作
      var tdOp = document.createElement("td");
      var opWrap = document.createElement("div");
      opWrap.className = "op-cell";

      var sel = document.createElement("select");
      sel.className = "role-select";
      sel.innerHTML = '<option value="">授予角色…</option>' +
        ["OPERATOR","JUDGE","DEPT_HEAD","ADMIN"].map(function(r){
          return '<option value="' + r + '">+ ' + r + '</option>';
        }).join("");
      sel.addEventListener("change", (function(uid, s){ return function(){
        var v = s.value;
        if(!v) return;
        grantRole(uid, v);
        s.value = "";
      }; })(u.id, sel));
      opWrap.appendChild(sel);

      // toggle enable/disable button
      var btn = document.createElement("button");
      btn.className = "btn btn-sm " + (u.enabled ? "btn-danger" : "btn-success");
      btn.textContent = u.enabled ? "禁用" : "启用";
      btn.addEventListener("click", (function(uid){ return function(){ toggleEnabled(uid); }; })(u.id));
      opWrap.appendChild(btn);

      tdOp.appendChild(opWrap);
      tr.appendChild(tdOp);

      tbody.appendChild(tr);
    });
  }

  function toggleEnabled(id){
    var users = loadUsers();
    for(var i=0;i<users.length;i++){
      if(users[i].id === id){
        users[i].enabled = !users[i].enabled;
        saveUsers(users);
        if(currentSession && currentSession.id === id){
          currentSession.enabled = users[i].enabled;
        }
        renderUserTable();
        return;
      }
    }
  }

  function grantRole(id, role){
    var users = loadUsers();
    for(var i=0;i<users.length;i++){
      if(users[i].id === id){
        if((users[i].roles || []).indexOf(role) === -1){
          users[i].roles = users[i].roles || [];
          users[i].roles.push(role);
          saveUsers(users);
          if(currentSession && currentSession.id === id){
            currentSession.roles = clone(users[i].roles);
          }
        }
        renderUserTable();
        renderDashboard();
        return;
      }
    }
  }

  /* ============ New User Modal ============ */
  var modal = document.getElementById("newUserModal");
  var newEmailEl = document.getElementById("newEmail");
  var newUsernameEl = document.getElementById("newUsername");
  document.getElementById("btnNewUser").addEventListener("click", openNewUserModal);
  document.getElementById("closeNewUser").addEventListener("click", closeNewUserModal);
  document.getElementById("cancelNewUser").addEventListener("click", closeNewUserModal);
  document.getElementById("confirmNewUser").addEventListener("click", confirmNewUser);
  modal.addEventListener("click", function(e){
    if(e.target === modal) closeNewUserModal();
  });

  // checkbox visual sync
  document.querySelectorAll("#roleCheckbox input[type=checkbox]").forEach(function(cb){
    cb.addEventListener("change", function(){
      var parent = cb.closest(".checkbox-item");
      if(cb.checked) parent.classList.add("checked");
      else parent.classList.remove("checked");
    });
  });

  function openNewUserModal(){
    newEmailEl.value = "";
    newUsernameEl.value = "";
    setError("errEmail","");
    setAlert("modalAlert","");
    document.querySelectorAll("#roleCheckbox input[type=checkbox]").forEach(function(cb){
      cb.checked = false;
      cb.closest(".checkbox-item").classList.remove("checked");
    });
    modal.classList.remove("hidden");
    newEmailEl.focus();
  }
  function closeNewUserModal(){
    modal.classList.add("hidden");
  }

  function confirmNewUser(){
    setAlert("modalAlert","");
    setError("errEmail","");
    var email = newEmailEl.value.trim();
    var username = newUsernameEl.value.trim();
    var roles = [];
    document.querySelectorAll("#roleCheckbox input[type=checkbox]:checked").forEach(function(cb){
      roles.push(cb.value);
    });

    if(!email){
      setError("errEmail","请输入邮箱");
      return;
    }
    if(email.indexOf("@") === -1 || email.indexOf(".") === -1 || email.length < 5){
      setError("errEmail","邮箱格式不正确（需包含 @ 和 .）");
      return;
    }
    var at = email.indexOf("@");
    var account = email.substring(0, at);
    if(!account){
      setError("errEmail","邮箱 @ 前的用户名部分不能为空");
      return;
    }

    var users = loadUsers();
    for(var i=0;i<users.length;i++){
      if(users[i].account === account){
        setError("errEmail","该账号（" + account + "）已存在");
        return;
      }
      if(users[i].email === email){
        setError("errEmail","该邮箱已存在");
        return;
      }
    }

    var newId = 1;
    users.forEach(function(u){ if(u.id >= newId) newId = u.id + 1; });

    var fullRoles = ["USER"].concat(roles);
    var newUser = {
      id: newId,
      account: account,
      password: "Welcome@2026",
      username: username || account,
      email: email,
      roles: fullRoles,
      points: 0,
      enabled: true,
      mustChangePassword: true
    };
    users.push(newUser);
    saveUsers(users);

    closeNewUserModal();
    // switch to users tab and re-render
    document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
    document.querySelectorAll(".tab-btn").forEach(function(b){
      if(b.getAttribute("data-tab") === "users") b.classList.add("active");
    });
    document.getElementById("tab-dashboard").classList.add("hidden");
    document.getElementById("tab-users").classList.remove("hidden");
    renderUserTable();
    renderDashboard();
  }

  /* ============ Logout ============ */
  document.getElementById("btnLogout").addEventListener("click", function(){
    if(!confirm("确定退出登录？")) return;
    currentSession = null;
    loginAccountEl.value = "";
    loginPasswordEl.value = "";
    setAlert("loginAlert","");
    show("view-login");
    loginAccountEl.focus();
  });

  /* ============ Init ============ */
  // ensure storage seeded
  loadUsers();
  // start at login
  show("view-login");
  loginAccountEl.focus();

})();
</script>
</body>
</html>
